    <h2>Javascript</h2>
    <p>How to use a javascript class.</p>
    <p id="student1"></p>
    <p id="student2"></p>
    <script>
        //creating a class 
        class Student {
            constructor(name, year) {
            this.name = name;
            this.year = year;
        }

        // Age methode 
        age() {
            let data = new Date();
            return date.getFullYear() - this.year;
         }
    }
     //using the class
     const student1 = new Student("Riya", 2014);
     document.getElementById("student1").innerHTML = "My name is " + student1.name + ". I was born in " + student1.year + " . And my age is " + student1.age();
     
     const student2 = new Student("Kanish", 2013);
     document.write("My name is " + student2.name + ". I was born in " + student2.year + " . And my age is " + student2.age());
     
    </script>
